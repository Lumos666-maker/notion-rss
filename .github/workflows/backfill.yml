# Retry summaries the morning ingest could not finish.
# 03:30 UTC = 11:30 Asia/Shanghai, after the 09:00 ingest.
name: Backfill summaries

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  backfill-news:
    name: Backfill 每日资讯
    runs-on: ubuntu-latest
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_READER_DATABASE_ID: ${{ secrets.NEWS_READER_DATABASE_ID }}
      RUN_MODE: backfill
      BACKFILL_DAYS: 3
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill empty summaries
        run: python main.py

  backfill-reader:
    name: Backfill reader
    runs-on: ubuntu-latest
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_READER_DATABASE_ID: ${{ secrets.NOTION_READER_DATABASE_ID }}
      RUN_MODE: backfill
      BACKFILL_DAYS: 3
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill empty summaries
        run: python main.py
